[project]
name = "provably-correct-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "fastapi>=0.121.3",
    "nltk>=3.9.2",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "strands-agents>=1.15.0",
    "uvicorn>=0.38.0",
    "prompt-toolkit>=3.0",
    "langfuse>=3.12.0",
    # scripts/parse-MDM-pdf.py (MDM documents from PDF)
    "pdfplumber>=0.11.9",
    "boto3>=1.40.75",
    "botocore>=1.40.75",
    "numpy>=2.4.2",
    "colorama>=0.4.6",
    "python-dotenv>=1.0",
    # The web service's Cognito auth (cdk/docker/auth.py), for running it locally.
    "itsdangerous>=2.2",
    "PyJWT[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pyflakes>=3.4.0",
    "pylint>=4.0.2",
]
